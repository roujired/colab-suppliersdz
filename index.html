<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Colab. Suppliers Directory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --dark-purple:#1B0722;
  --deep-purple:#6A00A8;
  --magenta:#C4007A;
  --orange-red:#FF3B3B;
  --soft-purple:#B1A7FD;
  --smooth-orange:#FFBA1F;
  --bg:#100310;
  --panel:#20082A;
  --panel2:#2A0E38;
  --border:#3D1B4D;
  --text:#F3EAF7;
  --text-dim:#B79CC7;
  --text-mute:#8A6E9C;
  --radius:14px;
  --tier-preferred:#3FBF7F;
  --tier-backup:#4FA6E0;
  --tier-new:var(--smooth-orange);
  --tier-blacklisted:var(--orange-red);
  font-family:'Onest',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(196,0,122,0.35), transparent 40%),
    radial-gradient(circle at 88% 15%, rgba(106,0,168,0.4), transparent 45%),
    radial-gradient(circle at 25% 85%, rgba(177,167,253,0.16), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(255,186,31,0.10), transparent 40%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 4px),
    linear-gradient(160deg, #1B0722 0%, #100310 55%, #170514 100%);
  background-attachment:fixed;
}
.app{max-width:1280px;margin:0 auto;padding:24px 20px 60px;}
.app[dir="rtl"] .tabbar,.app[dir="rtl"] .contact-block{direction:rtl;}
h1,h2,h3{font-weight:600;margin:0;}
button,input,select,textarea{font-family:inherit;color:var(--text);}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;}
input:focus,select:focus,textarea:focus{outline:1px solid var(--soft-purple);}
button{cursor:pointer;}
.btn{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text);}
.btn:hover{border-color:var(--soft-purple);}
.btn-primary{background:linear-gradient(90deg,var(--deep-purple),var(--magenta));border:none;color:#fff;font-weight:600;}
.btn-primary:hover{opacity:0.9;}
.btn-danger{border-color:var(--orange-red);color:var(--orange-red);}
.btn-sm{padding:5px 10px;font-size:12px;}
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- Login screen ---------- */
#loginScreen{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(196,0,122,0.45), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(106,0,168,0.5), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(255,186,31,0.12), transparent 40%),
    linear-gradient(160deg, #1B0722 0%, #100310 60%, #170514 100%);
  padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:rgba(32,8,42,0.75);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:20px;padding:34px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.45);
}
.login-mark{width:56px;height:56px;border-radius:16px;background:var(--dark-purple);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
.login-title{text-align:center;font-size:19px;font-weight:600;}
.login-sub{text-align:center;font-size:12px;color:var(--text-dim);margin-top:4px;margin-bottom:26px;}
.login-field{margin-bottom:14px;}
.login-field label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:5px;}
.login-field input{width:100%;padding:11px 12px;font-size:14px;border-radius:10px;}
.login-error{background:rgba(255,59,59,0.12);border:1px solid var(--orange-red);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:14px;color:#ffb3b3;}
.login-btn{width:100%;padding:12px;border-radius:10px;font-size:14px;margin-top:6px;}
.login-foot{text-align:center;font-size:11px;color:var(--text-mute);margin-top:18px;}

/* ---------- header ---------- */
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:40px;height:40px;border-radius:10px;background:var(--dark-purple);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--border);}
.brand-title{font-size:20px;font-weight:600;}
.brand-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.lang-switch button{background:var(--panel2);border:none;padding:7px 10px;font-size:12px;border-inline-end:1px solid var(--border);}
.lang-switch button:last-child{border-inline-end:none;}
.lang-switch button.active{background:var(--deep-purple);color:#fff;}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;font-size:12px;}
.user-chip .avatar{width:22px;height:22px;border-radius:50%;background:var(--deep-purple);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.role-pill{font-size:9px;padding:1px 6px;border-radius:10px;background:var(--soft-purple);color:#2a0e38;font-weight:700;text-transform:uppercase;}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:rgba(32,8,42,0.7);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;}
.stat-value{font-size:24px;font-weight:600;margin-top:4px;}
.stat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);}

.ai-bar{background:linear-gradient(90deg,rgba(106,0,168,0.25),rgba(196,0,122,0.25));border:1px solid var(--soft-purple);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;}
.ai-bar-row{display:flex;gap:8px;}
.ai-bar-row input{flex:1;}
.ai-result{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.6;white-space:pre-wrap;}
.ai-loading{font-size:12px;color:var(--text-dim);margin-top:8px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center;}
.filters input[type="text"]{min-width:180px;flex:1;}
.filters select{min-width:120px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{background:rgba(32,8,42,0.7);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s;position:relative;}
.card:hover{border-color:var(--soft-purple);}
.card-top{display:flex;gap:10px;align-items:flex-start;}
.card-logo{width:44px;height:44px;border-radius:10px;background:var(--panel2);flex-shrink:0;object-fit:cover;border:1px solid var(--border);}
.card-logo-fallback{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--soft-purple);}
.card-name{font-size:15px;font-weight:600;}
.card-owner{font-size:10px;color:var(--text-mute);margin-top:1px;}
.card-cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.cat-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.tier-badge{position:absolute;top:14px;inset-inline-end:14px;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--text-dim);}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--text-dim);}
.stars{color:var(--smooth-orange);font-size:12px;}
.card-actions{display:flex;gap:6px;margin-top:10px;}
.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;}
.icon-btn:hover{border-color:var(--soft-purple);}

.empty{text-align:center;padding:60px 20px;color:var(--text-dim);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:50;display:none;}
.overlay.open{display:block;}
.panel{position:fixed;top:0;inset-inline-end:0;width:min(460px,92vw);height:100%;background:#1c0725;border-inline-start:1px solid var(--border);z-index:51;overflow-y:auto;transform:translateX(100%);transition:transform .2s;padding:20px;}
.app[dir="rtl"] .panel{transform:translateX(-100%);}
.panel.open{transform:translateX(0);}
.panel-close{position:absolute;top:16px;inset-inline-end:16px;background:none;border:none;font-size:20px;color:var(--text-dim);}
.panel h2{margin-bottom:2px;}
.section{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--soft-purple);margin-bottom:8px;}
.field-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px;}
.field-label{color:var(--text-dim);flex-shrink:0;}
.field-val{text-align:end;word-break:break-word;}
.contact-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;}
.contact-card .name{font-weight:600;}
.contact-card .role{color:var(--text-dim);font-size:11px;}
.contact-links{display:flex;gap:6px;margin-top:6px;}
.log-entry{border-inline-start:2px solid var(--soft-purple);padding-inline-start:10px;margin-bottom:8px;font-size:12px;}
.log-date{color:var(--text-dim);font-size:11px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.form-field label{font-size:11px;color:var(--text-dim);}
.contact-block{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
.warn-box{background:rgba(255,59,59,0.12);border:1px solid var(--orange-red);border-radius:10px;padding:10px;font-size:12px;margin-bottom:10px;}

.cat-checklist{display:flex;flex-wrap:wrap;gap:6px;max-height:170px;overflow-y:auto;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);}
.cat-check-item{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--border);cursor:pointer;user-select:none;}
.cat-check-item input{margin:0;}

.cat-manage-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2);}
.cat-manage-row input[type="text"]{flex:1;}
.cat-manage-row input[type="color"]{width:34px;height:30px;padding:2px;border-radius:6px;}

.quick-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.star-picker{display:flex;gap:3px;font-size:18px;cursor:pointer;}
.star-picker span{color:var(--text-mute);}
.star-picker span.filled{color:var(--smooth-orange);}

/* admin */
.admin-user-row{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2);flex-wrap:wrap;}
.admin-user-row .uname{font-weight:600;font-size:13px;flex:1;min-width:100px;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:5px;}
.status-dot.active{background:var(--tier-preferred);}
.status-dot.deactivated{background:var(--text-mute);}
.activity-row{font-size:12px;padding:7px 0;border-bottom:1px solid var(--border);}
.activity-row .meta{color:var(--text-mute);font-size:10px;}

/* price book */
.price-item-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
.price-item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.price-item-name{font-weight:600;font-size:13px;}
.price-item-base{font-size:13px;color:var(--smooth-orange);font-weight:600;}
.price-item-meta{font-size:11px;color:var(--text-mute);margin-top:2px;}
.price-sub-list{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.price-sub-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);padding:2px 0;}
.price-history-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--text-mute);}
.price-item-edit-block{background:var(--panel2);border:1px solid var(--soft-purple);border-radius:10px;padding:10px;margin-bottom:8px;}
.tier-row,.option-row{display:grid;grid-template-columns:1fr 90px 90px auto;gap:6px;align-items:center;margin-bottom:6px;}
.tier-row input,.option-row input{padding:6px 8px;font-size:12px;}

/* calculator */
.calc-line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--border);}
.calc-total{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:17px;font-weight:700;color:var(--smooth-orange);}
.calc-option-toggle{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border);}
.compare-table{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px;}
.compare-table th,.compare-table td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--border);}
.compare-table th{color:var(--soft-purple);font-weight:600;font-size:11px;text-transform:uppercase;}
.currency-row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-dim);margin-bottom:10px;}
.currency-row input{width:90px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">🐦‍⬛</div>
    <div class="login-title">Colab. Suppliers</div>
    <div class="login-sub">Observe. Connect. Create.</div>
    <div id="loginError" class="login-error hidden"></div>
    <div class="login-field">
      <label>Username</label>
      <input type="text" id="loginUsername" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn btn-primary login-btn" id="btnLogin">Log in</button>
    <div class="login-foot">Accounts are created by your admin. Contact them if you don't have one.</div>
  </div>
</div>

<div class="app hidden" id="app" dir="ltr">
  <h1 class="sr-only">Colab. suppliers directory dashboard</h1>

  <div class="header">
    <div class="brand">
      <div class="brand-mark">🐦‍⬛</div>
      <div>
        <div class="brand-title" data-t="title">Suppliers Directory</div>
        <div class="brand-sub" data-t="subtitle">Colab. — Observe. Connect. Create.</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-switch">
        <button data-lang="en">EN</button>
        <button data-lang="fr">FR</button>
        <button data-lang="ar">AR</button>
      </div>
      <button class="btn hidden" id="btnManageCats" data-t="manageCategories">Manage categories</button>
      <button class="btn" id="btnCalculator">🧮 Cost Calculator</button>
      <button class="btn hidden" id="btnAdminPanel">🛡️ Admin</button>
      <button class="btn" id="btnExport" data-t="exportCsv">Export CSV</button>
      <button class="btn" id="btnImport" data-t="importCsv">Import CSV</button>
      <input type="file" id="fileImport" accept=".csv" class="hidden">
      <button class="btn btn-primary hidden" id="btnAdd" data-t="addSupplier">+ Add supplier</button>
      <div class="user-chip">
        <span class="avatar" id="userAvatar">?</span>
        <span id="userNameLabel">—</span>
        <span class="role-pill" id="userRolePill">user</span>
        <button class="btn btn-sm" id="btnLogout" style="padding:3px 8px">⏻</button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="ai-bar">
    <div class="ai-bar-row">
      <input type="text" id="aiQuery" data-t-ph="aiPlaceholder" placeholder="e.g. I need a cheap trophy maker in Algiers available fast">
      <button class="btn btn-primary" id="btnAiFind" data-t="aiFindBtn">Ask AI</button>
    </div>
    <div id="aiLoading" class="ai-loading hidden" data-t="aiThinking">Thinking...</div>
    <div id="aiResult" class="ai-result hidden"></div>
  </div>

  <div class="filters">
    <input type="text" id="fSearch" data-t-ph="searchPh" placeholder="Search suppliers...">
    <select id="fCategory"></select>
    <select id="fStatus"></select>
    <select id="fTier"></select>
    <select id="fCity"></select>
    <select id="fRating"></select>
    <select id="fSort"></select>
    <label class="btn btn-sm hidden" id="viewAllWrap" style="display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="viewAllToggle" style="margin:0"> <span id="viewAllLabel">View all users' data</span>
    </label>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="emptyState" data-t="emptyState">No suppliers yet. Add your first one.</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="detailPanel"></div>
<div class="panel" id="formPanel" style="width:min(560px,94vw)"></div>
<div class="panel" id="categoryPanel" style="width:min(460px,94vw)"></div>
<div class="panel" id="adminPanel" style="width:min(560px,94vw)"></div>
<div class="panel" id="calcPanel" style="width:min(560px,94vw)"></div>

function darkTextFor(hex){
  try{
    const h = hex.replace('#','');
    const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    const lum = (0.299*r+0.587*g+0.114*b);
    return lum > 150 ? '#3a2a40' : '#f5f5f5';
  }catch(e){ return '#3a2a40'; }
}

/* ================= AUTH ================= */
function saveSession(sess){ localStorage.setItem('colab_session', JSON.stringify(sess)); state.session = sess; }
function loadSession(){ try{ const s = localStorage.getItem('colab_session'); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('colab_session'); state.session = null; state.profile = null; }

async function restSelect(path){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${state.session.access_token}` }
  });
  if(!res.ok) throw new Error('REST select failed: ' + res.status);
  return res.json();
}
async function restUpsert(table, rows, onConflict){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${onConflict ? '?on_conflict='+onConflict : ''}`, {
    method:'POST',
    headers:{
      apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${state.session.access_token}`,
      'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'
    },
    body: JSON.stringify(rows)
  });
  if(!res.ok) throw new Error('REST upsert failed: ' + res.status + ' ' + await res.text());
  return true;
}
async function restInsert(table, row){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    body: JSON.stringify(row)
  });
  if(!res.ok) throw new Error('REST insert failed: ' + res.status);
  return true;
}
async function callEdgeFunction(name, body){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${state.session.access_token}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function login(username, password){
  const email = `${username.toLowerCase().trim()}@${EMAIL_DOMAIN}`;
  const statusRes = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_login_status`, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ p_username: username.toLowerCase().trim() })
  });
  const statusData = await statusRes.json();
  const st = Array.isArray(statusData) ? statusData[0] : statusData;
  if(st && st.locked) throw new Error('Account locked due to failed attempts. Try again in a few minutes.');
  if(st && st.deactivated) throw new Error('This account has been deactivated.');

  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  await fetch(`${SUPABASE_URL}/rest/v1/rpc/record_login_attempt`, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ p_username: username.toLowerCase().trim(), p_success: res.ok })
  });
  if(!res.ok) throw new Error('Incorrect username or password.');
  saveSession(data);
  await loadProfile();
}

  state.profile = rows[0];

/* ================= per-user data storage ================= */
async function loadOwnKV(key){
  const rows = await restSelect(`colab_kv?user_id=eq.${state.session.user.id}&key=eq.${encodeURIComponent(key)}&select=value`);
  return rows.length ? rows[0].value : null;
}
async function saveOwnKV(key, value){
  await restUpsert('colab_kv', [{ user_id: state.session.user.id, key, value, updated_at: new Date().toISOString() }], 'user_id,key');
}
async function loadAllUsersKV(key){
  return restSelect(`colab_kv?key=eq.${encodeURIComponent(key)}&select=user_id,value`);
}

async function logActivity(action, details){
  try{
    await restInsert('activity_log', { user_id: state.session.user.id, username: state.profile.username, action, details });
  }catch(e){}
}

async function loadStorage(){
  if(state.viewAll && state.profile.role === 'admin'){
    const rows = await loadAllUsersKV('colab_suppliers');
    let merged = [];
    state.ownerMap = {};
    const usersById = {};
    state.usersCache.forEach(u => usersById[u.id] = u.username);
    for(const row of rows){
      let arr = [];
      try{ arr = JSON.parse(row.value); }catch(e){ arr = []; }
      arr.forEach(s => {
        if(!s.categories) s.categories = s.category ? [s.category] : [];
        if(!s.priceItems) s.priceItems = [];
        state.ownerMap[s.id] = row.user_id;
        s._ownerUsername = usersById[row.user_id] || row.user_id.slice(0,8);
        merged.push(s);
      });
    }
    state.suppliers = merged;
    const catRows = await loadAllUsersKV('colab_supplier_categories');
    let catMap = {};
    DEFAULT_CATEGORIES.forEach(c => catMap[c.name] = c);
    catRows.forEach(row => {
      try{ JSON.parse(row.value).forEach(c => catMap[c.name] = c); }catch(e){}
    });
    state.categories = Object.values(catMap);
  } else {
    try{
      const v = await loadOwnKV('colab_suppliers');
      state.suppliers = v ? JSON.parse(v) : [];
      state.suppliers.forEach(s => { if(!s.categories) s.categories = s.category ? [s.category] : []; if(!s.priceItems) s.priceItems = []; });
    }catch(e){ state.suppliers = []; }
    try{
      const v = await loadOwnKV('colab_supplier_categories');
      state.categories = v ? JSON.parse(v) : DEFAULT_CATEGORIES.slice();
    }catch(e){ state.categories = DEFAULT_CATEGORIES.slice(); }
    state.ownerMap = {};
  }
  try{
    const v = await loadOwnKV('colab_supplier_lang');
    if(v) state.lang = v;
  }catch(e){}
}

async function saveSuppliers(supplier){
  if(state.viewAll && supplier && state.ownerMap[supplier.id] && state.ownerMap[supplier.id] !== state.session.user.id){
    const ownerId = state.ownerMap[supplier.id];
    const rows = await restSelect(`colab_kv?user_id=eq.${ownerId}&key=eq.colab_suppliers&select=value`);
    let arr = rows.length ? JSON.parse(rows[0].value) : [];
    const idx = arr.findIndex(s => s.id === supplier.id);
    const clean = {...supplier}; delete clean._ownerUsername;
    if(idx >= 0) arr[idx] = clean; else arr.push(clean);
    await restUpsert('colab_kv', [{ user_id: ownerId, key:'colab_suppliers', value: JSON.stringify(arr), updated_at: new Date().toISOString() }], 'user_id,key');
    return;
  }
  const clean = state.suppliers
    .filter(s => !state.viewAll || !state.ownerMap[s.id] || state.ownerMap[s.id] === state.session.user.id)
    .map(s => { const c = {...s}; delete c._ownerUsername; return c; });
  await saveOwnKV('colab_suppliers', JSON.stringify(clean));
}
async function deleteSupplierRemote(supplierId){
  if(state.viewAll && state.ownerMap[supplierId] && state.ownerMap[supplierId] !== state.session.user.id){
    const ownerId = state.ownerMap[supplierId];
    const rows = await restSelect(`colab_kv?user_id=eq.${ownerId}&key=eq.colab_suppliers&select=value`);
    let arr = rows.length ? JSON.parse(rows[0].value) : [];
    arr = arr.filter(s => s.id !== supplierId);
    await restUpsert('colab_kv', [{ user_id: ownerId, key:'colab_suppliers', value: JSON.stringify(arr), updated_at: new Date().toISOString() }], 'user_id,key');
    return;
  }
  state.suppliers = state.suppliers.filter(s => s.id !== supplierId);
  await saveSuppliers();
}
async function saveCategories(){
  await saveOwnKV('colab_supplier_categories', JSON.stringify(state.categories));
}
async function saveLang(){
  await saveOwnKV('colab_supplier_lang', state.lang);
}

  document.getElementById('fCity').value = state.filters.city;
  document.getElementById('fRating').value = state.filters.rating;
  document.getElementById('fSort').value = state.filters.sort;
  document.getElementById('fSearch').value = state.filters.search;
}

function filteredSuppliers(){
  let list = state.suppliers.slice();
  const f = state.filters;
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(s => (s.name||'').toLowerCase().includes(q) || (s.tags||[]).join(' ').toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q) || (s.categories||[]).join(' ').toLowerCase().includes(q));
  }
  if(f.category) list = list.filter(s => (s.categories||[]).includes(f.category));
  if(f.status) list = list.filter(s => s.status === f.status);
  if(f.tier) list = list.filter(s => s.tier === f.tier);
  if(f.city) list = list.filter(s => s.city === f.city);
  if(f.rating) list = list.filter(s => (s.rating||0) >= parseInt(f.rating));
  if(f.sort === 'name') list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(f.sort === 'rating') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  if(f.sort === 'last') list.sort((a,b)=>(b.lastContacted||'').localeCompare(a.lastContacted||''));
  return list;
}

function catBadgesHtml(categories){
  return (categories||[]).map(cn => {
    const cat = categoryOf(cn);

    return `<span class="cat-badge" style="background:${color};color:${darkTextFor(color)}">${esc(cn)}</span>`;

}

async function addLogEntry(id){
  const input = document.getElementById('newLogNote');
  const note = input.value.trim();
  if(!note) return;
  const s = state.suppliers.find(x=>x.id===id);
  if(!s) return;
  s.log = s.log || [];
  const d = new Date();
  const dateStr = String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  s.log.push({date:dateStr, note});
  await saveSuppliers(s);
  openDetail(id);
  renderGrid();
}

/* ================= Price Book ================= */
function fmtDzd(n){
  const num = Number(n)||0;
  return num.toLocaleString('en-US') + ' DZD';
}

function priceForQty(item, qty){
  qty = parseInt(qty) || 1;
  let price = item.basePrice || 0;
  if(item.tiers && item.tiers.length){
    const sorted = item.tiers.slice().sort((a,b)=>(a.minQty||0)-(b.minQty||0));
    for(const tier of sorted){
      if(qty >= (tier.minQty||0)) price = tier.price;
    }
  }
  return price;
}

function priceBookHtml(s, isViewer){
  const items = s.priceItems || [];
  if(items.length === 0){
    return `<div class="field-row"><span class="field-label">—</span></div>`;
  }
  return items.map(item => {
    const tiersHtml = (item.tiers||[]).length
      ? `<div class="price-sub-list">${item.tiers.map(tr=>`<div class="price-sub-row"><span>Qty ${tr.minQty}+</span><span>${fmtDzd(tr.price)}</span></div>`).join('')}</div>`
      : '';
    const optionsHtml = (item.options||[]).length
      ? `<div class="price-sub-list">${item.options.map(op=>`<div class="price-sub-row"><span>+ ${esc(op.name)}</span><span>+${fmtDzd(op.price)}</span></div>`).join('')}</div>`
      : '';
    const lastHistory = (item.priceHistory||[]).slice(-3).reverse();
    const historyHtml = lastHistory.length
      ? `<div class="price-sub-list">${lastHistory.map(h=>`<div class="price-history-row"><span>${esc(h.date)}</span><span>${fmtDzd(h.price)}</span></div>`).join('')}</div>`
      : '';
    return `<div class="price-item-card">
      <div class="price-item-head">
        <div>
          <div class="price-item-name">${esc(item.name||'Untitled')}</div>
          <div class="price-item-meta">${esc(item.unit||'')}</div>
        </div>
        <div class="price-item-base">${fmtDzd(item.basePrice)}</div>
      </div>
      ${tiersHtml}
      ${optionsHtml}
      ${historyHtml}
      ${isViewer ? '' : `<div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-sm" onclick="openPriceItemEditor('${s.id}','${item.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deletePriceItem('${s.id}','${item.id}')">Delete</button>
      </div>`}
    </div>`;
  }).join('');
}

function openPriceItemEditor(supplierId, itemId){
  const s = state.suppliers.find(x=>x.id===supplierId);
  if(!s) return;
  s.priceItems = s.priceItems || [];
  let item = itemId ? s.priceItems.find(i=>i.id===itemId) : emptyPriceItem();
  if(!item) item = emptyPriceItem();
  renderPriceItemEditor(s, item, !!itemId);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('formPanel').classList.add('open');
  document.getElementById('detailPanel').classList.remove('open');
}

  document.getElementById('formPanel').innerHTML = `

    <h2>${isEditing ? 'Edit' : 'Add'} price item — ${esc(s.name)}</h2>

      </div>
    </div>

    <div class="section">
      <div class="section-title">Quantity tiers (optional)</div>
      <p style="font-size:11px;color:var(--text-mute);margin:0 0 8px">Price changes based on quantity ordered. Leave empty for a flat price.</p>
      <div id="tiersWrap">${tiersHtml}</div>
      <button class="btn btn-sm" id="btnAddTier">+ Add tier</button>
    </div>

    <div class="section">
      <div class="section-title">Options / modifiers (optional)</div>
      <p style="font-size:11px;color:var(--text-mute);margin:0 0 8px">Add-ons that stack on top of the base price (e.g. Recto-Verso, Pelliculage).</p>
      <div id="optionsWrap">${optionsHtml}</div>
      <button class="btn btn-sm" id="btnAddOption">+ Add option</button>
    </div>

    ${(item.priceHistory||[]).length ? `
    <div class="section">
      <div class="section-title">Price history</div>
      ${item.priceHistory.slice().reverse().map(h=>`<div class="price-history-row"><span>${esc(h.date)}</span><span>${fmtDzd(h.price)}</span></div>`).join('')}
    </div>` : ''}

    <div style="display:flex;gap:8px;margin-top:20px;position:sticky;bottom:0;background:#1c0725;padding-top:10px">
      <button class="btn btn-primary" style="flex:1" id="btnSavePriceItem">${esc(t('save'))}</button>

    renderPriceItemEditor(s, item, isEditing);
  };
}
function removeTierRow(tid){ window.__removeTierRowRef(tid); }
function removeOptionRow(oid){ window.__removeOptionRowRef(oid); }

async function savePriceItem(s, item, isEditing){
  const name = document.getElementById('pi_name').value.trim();
  if(!name){ alert('Item name is required.'); return; }
  const newBasePrice = parseFloat(document.getElementById('pi_baseprice').value) || 0;
  const oldBasePrice = item.basePrice;

  item.name = name;
  item.unit = document.getElementById('pi_unit').value.trim();

  document.querySelectorAll('#tiersWrap .tier-row').forEach((row, idx) => {
    const tid = row.dataset.tid;
    const t = item.tiers.find(x=>x.id===tid);
    if(t){
      t.minQty = parseInt(row.querySelector('.tier-minqty').value) || 0;
      t.price = parseFloat(row.querySelector('.tier-price').value) || 0;
    }
  });
  document.querySelectorAll('#optionsWrap .option-row').forEach(row => {
    const oid = row.dataset.oid;
    const o = item.options.find(x=>x.id===oid);
    if(o){
      o.name = row.querySelector('.option-name').value.trim();
      o.price = parseFloat(row.querySelector('.option-price').value) || 0;
    }
  });

  item.priceHistory = item.priceHistory || [];
  if(!isEditing || oldBasePrice !== newBasePrice){
    item.priceHistory.push({ date: todayStr(), price: newBasePrice });
  }
  item.basePrice = newBasePrice;

  s.priceItems = s.priceItems || [];
  if(!isEditing) s.priceItems.push(item);

  await saveSuppliers(s);
  logActivity(isEditing ? 'edit_price_item' : 'add_price_item', `${s.name} — ${item.name}`);
  closePanels();
  openDetail(s.id);
  renderGrid();
}

async function deletePriceItem(supplierId, itemId){
  if(!confirm('Delete this price item? This cannot be undone.')) return;
  const s = state.suppliers.find(x=>x.id===supplierId);
  if(!s) return;
  s.priceItems = (s.priceItems||[]).filter(i=>i.id!==itemId);
  await saveSuppliers(s);
  logActivity('delete_price_item', s.name);
  openDetail(supplierId);
  renderGrid();
}

function suppliersWithPriceItems(){

function renderCalculator(){
  const suppliersList = suppliersWithPriceItems();
  const supplierOptions = suppliersList.map(s => `<option value="${s.id}" ${calcState.supplierId===s.id?'selected':''}>${esc(s.name)}${s._ownerUsername?' ('+esc(s._ownerUsername)+')':''}</option>`).join('');

  const selectedSupplier = suppliersList.find(s => s.id === calcState.supplierId) || suppliersList[0];
  if(selectedSupplier && !calcState.supplierId) calcState.supplierId = selectedSupplier.id;

  const items = selectedSupplier ? (selectedSupplier.priceItems||[]) : [];
  if(items.length && !items.find(i=>i.id===calcState.itemId)) calcState.itemId = items[0].id;
  const item = items.find(i => i.id === calcState.itemId);

  let bodyHtml = '';
  if(!selectedSupplier){
    bodyHtml = `<div class="field-row">No suppliers have a price book yet. Add price items to a supplier first.</div>`;
  } else if(item){
    const itemOptions = items.map(i => `<option value="${i.id}" ${i.id===calcState.itemId?'selected':''}>${esc(i.name)}</option>`).join('');
    const base = priceForQty(item, calcState.qty);
    let optionsTotal = 0;
    const optionsHtml = (item.options||[]).map(op => {
      const checked = !!calcState.selectedOptions[op.id];
      if(checked) optionsTotal += op.price;
      return `<label class="calc-option-toggle">
        <input type="checkbox" class="calc-opt-check" data-oid="${op.id}" ${checked?'checked':''}>
        <span style="flex:1">${esc(op.name)}</span>
        <span>+${fmtDzd(op.price)}</span>
      </label>`;
    }).join('');
    const total = base + optionsTotal;

    let convertedHtml = '';
    if(calcState.exchangeRate > 0 && calcState.exchangeLabel){
      const converted = total / calcState.exchangeRate;
      convertedHtml = `<div class="calc-line"><span>≈ in ${esc(calcState.exchangeLabel)}</span><span>${converted.toLocaleString('en-US', {maximumFractionDigits:2})}</span></div>`;
    }

    // compare across other suppliers with same item name
    const compareRows = suppliersList
      .filter(s => s.id !== selectedSupplier.id)
      .map(s => {
        const match = (s.priceItems||[]).find(i => i.name.trim().toLowerCase() === item.name.trim().toLowerCase());
        if(!match) return null;
        return `<tr><td>${esc(s.name)}</td><td>${fmtDzd(priceForQty(match, calcState.qty))}</td></tr>`;
      })
      .filter(Boolean);
    const compareHtml = compareRows.length ? `
      <div class="section">
        <div class="section-title">Compare across suppliers — "${esc(item.name)}"</div>
        <table class="compare-table">
          <tr><th>Supplier</th><th>Price</th></tr>
          <tr><td><strong>${esc(selectedSupplier.name)}</strong></td><td><strong>${fmtDzd(base)}</strong></td></tr>
          ${compareRows.join('')}
        </table>
      </div>` : '';

    bodyHtml = `
      <div class="form-field"><label>Supplier</label><select id="calc_supplier">${supplierOptions}</select></div>
      <div class="form-field"><label>Item / service</label><select id="calc_item">${itemOptions}</select></div>
      <div class="form-field"><label>Quantity</label><input type="number" id="calc_qty" min="1" value="${calcState.qty}"></div>

      ${(item.options||[]).length ? `<div class="section"><div class="section-title">Options</div>${optionsHtml}</div>` : ''}

      <div class="section">
        <div class="calc-line"><span>Base price ${(item.tiers||[]).length?'(tier for qty '+calcState.qty+')':''}</span><span>${fmtDzd(base)}</span></div>
        ${(item.options||[]).filter(op=>calcState.selectedOptions[op.id]).map(op=>`<div class="calc-line"><span>+ ${esc(op.name)}</span><span>+${fmtDzd(op.price)}</span></div>`).join('')}
        <div class="calc-total"><span>Total cost to us</span><span>${fmtDzd(total)}</span></div>
        ${convertedHtml}
      </div>

      <div class="section">
        <div class="section-title">Currency display (optional)</div>
        <div class="currency-row">
          <span>1</span>
          <input type="text" id="calc_currlabel" value="${esc(calcState.exchangeLabel)}" placeholder="EUR">
          <span>=</span>
          <input type="number" id="calc_currrate" value="${calcState.exchangeRate||''}" placeholder="280">
          <span>DZD</span>
          <button class="btn btn-sm" id="btnApplyRate">Apply</button>
        </div>
      </div>

      ${compareHtml}
    `;
  } else {
    bodyHtml = `<div class="field-row">This supplier has no price items yet.</div>`;
  }

  document.getElementById('calcPanel').innerHTML = `
    <button class="panel-close" onclick="closePanels()">✕</button>
    <h2>🧮 Cost Calculator</h2>
    <p style="font-size:12px;color:var(--text-dim);margin-top:4px">Internal cost only — this is what it costs Colab., not a client price.</p>
    <div class="section">${bodyHtml}</div>
  `;

  if(!selectedSupplier) return;

  const supplierSel = document.getElementById('calc_supplier');
  if(supplierSel) supplierSel.addEventListener('change', e => {
    calcState.supplierId = e.target.value;
    calcState.itemId = null;
    calcState.selectedOptions = {};
    renderCalculator();
  });
  const itemSel = document.getElementById('calc_item');
  if(itemSel) itemSel.addEventListener('change', e => {
    calcState.itemId = e.target.value;
    calcState.selectedOptions = {};
    renderCalculator();
  });
  const qtyInput = document.getElementById('calc_qty');
  if(qtyInput) qtyInput.addEventListener('input', e => {
    calcState.qty = parseInt(e.target.value) || 1;
    renderCalculator();
  });
  document.querySelectorAll('.calc-opt-check').forEach(cb => {
    cb.addEventListener('change', e => {
      calcState.selectedOptions[e.target.dataset.oid] = e.target.checked;
      renderCalculator();
    });
  });
  const applyRateBtn = document.getElementById('btnApplyRate');
  if(applyRateBtn) applyRateBtn.addEventListener('click', () => {
    calcState.exchangeLabel = document.getElementById('calc_currlabel').value.trim();
    calcState.exchangeRate = parseFloat(document.getElementById('calc_currrate').value) || 0;
    renderCalculator();
  });
}

function checkDuplicate(supplier){
  return state.suppliers.some(s => s.id !== supplier.id && (
    (s.name && supplier.name && s.name.trim().toLowerCase() === supplier.name.trim().toLowerCase()) ||
    (s.contacts && supplier.contacts && s.contacts.some(c1 => supplier.contacts.some(c2 => c1.phone && c2.phone && c1.phone.replace(/\D/g,'') === c2.phone.replace(/\D/g,'') && c1.phone.replace(/\D/g,'').length > 5)))
  ));
}

function collectFormContacts(s){
  const blocks = document.querySelectorAll('#contactsWrap .contact-block');
  if(blocks.length === 0) return;
  s.contacts = Array.from(blocks).map(b => ({
    name: b.querySelector('.c-name').value.trim(),
    role: b.querySelector('.c-role').value.trim(),
    phone: b.querySelector('.c-phone').value.trim(),
    whatsapp: b.querySelector('.c-whatsapp').value.trim(),
    email: b.querySelector('.c-email').value.trim(),
  }));
  if(s.contacts.length===0) s.contacts.push(emptyContact());
}
function collectFormCategories(s){
  const boxes = document.querySelectorAll('#catChecklist .cat-check');
  if(boxes.length === 0) return;
  s.categories = Array.from(boxes).filter(b=>b.checked).map(b=>b.value);
}

async function saveForm(s){
  collectFormContacts(s);
  collectFormCategories(s);
  const isNew = !editingId;
  s.name = document.getElementById('f_name').value.trim();
  s.tags = document.getElementById('f_tags').value.split(',').map(x=>x.trim()).filter(Boolean);
  s.description = document.getElementById('f_description').value.trim();
  s.tier = document.getElementById('f_tier').value;
  s.status = document.getElementById('f_status').value;
  s.availability = document.getElementById('f_availability').value.trim();
  s.rating = parseInt(document.getElementById('f_rating').value) || 0;
  s.review = document.getElementById('f_review').value.trim();
  s.wouldWorkAgain = document.getElementById('f_wouldWorkAgain').value.trim();
  s.blacklistReason = document.getElementById('f_blacklistReason').value.trim();
  s.paymentTerms = document.getElementById('f_paymentTerms').value.trim();
  s.paymentMethod = document.getElementById('f_paymentMethod').value.trim();
  s.bankInfo = document.getElementById('f_bankInfo').value.trim();
  s.invoiceHistory = document.getElementById('f_invoiceHistory').value.trim();
  s.city = document.getElementById('f_city').value.trim();
  s.delivery = document.getElementById('f_delivery').value.trim();
  s.turnaround = document.getElementById('f_turnaround').value.trim();
  s.minQty = document.getElementById('f_minQty').value.trim();
  s.languages = document.getElementById('f_languages').value.trim();
  s.priceRange = document.getElementById('f_priceRange').value.trim();
  s.lastQuoted = document.getElementById('f_lastQuoted').value.trim();
  s.social = document.getElementById('f_social').value.trim();
  s.website = document.getElementById('f_website').value.trim();
  s.portfolio = document.getElementById('f_portfolio').value.trim();
  s.priceList = document.getElementById('f_priceList').value.trim();
  s.catalog = document.getElementById('f_catalog').value.trim();
  s.contract = document.getElementById('f_contract').value.trim();
  s.photos = document.getElementById('f_photos').value.split('\\n').map(x=>x.trim()).filter(Boolean);
  s.howMet = document.getElementById('f_howMet').value.trim();
  s.projects = document.getElementById('f_projects').value.trim();
  s.lastContacted = document.getElementById('f_lastContacted').value.trim();

  if(!s.name){ alert(t('fName') + ' ?'); return; }

  if(checkDuplicate(s)){
    const proceed = confirm(t('duplicateWarning'));
    if(!proceed) return;
  }

  if(isNew) state.ownerMap[s.id] = state.session.user.id;
  const idx = state.suppliers.findIndex(x=>x.id===s.id);
  if(idx >= 0) state.suppliers[idx] = s; else state.suppliers.push(s);
  await saveSuppliers(s);
  logActivity(isNew ? 'add_supplier' : 'edit_supplier', s.name);
  renderStats(); renderFilters(); renderGrid();
  closePanels();
}

async function deleteSupplier(id){
  if(!confirm(t('confirmDelete'))) return;
  const s = state.suppliers.find(x=>x.id===id);
  await deleteSupplierRemote(id);
  closePanels();
  logActivity('delete_supplier', s ? s.name : id);
  renderStats(); renderFilters(); renderGrid();
}

      <button class="btn" style="flex:1" onclick="closeCategoryManager(${returnToSupplier?'true':'false'})">${esc(t('close'))}</button>
    </div>
  `;

  document.getElementById('btnAddCatFinal').addEventListener('click', async () => {
    const name = document.getElementById('newCatName').value.trim();
    const color = document.getElementById('newCatColor').value;
    const group = document.getElementById('newCatGroup').value.trim() || 'Custom';
    if(!name){ alert(t('categoryNameRequired')); return; }
    if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){ alert(name); return; }
    state.categories.push({name, color, group});
    await saveCategories();
    renderFilters();
    renderCategoryManager(returnToSupplier);
  });

  window.__catManagerReturnSupplier = returnToSupplier;
}

async function saveCategoryEdit(oldName){
  const row = document.querySelector(`.cat-manage-row[data-name="${CSS.escape(oldName)}"]`);
  if(!row) return;
  const newName = row.querySelector('.cm-name').value.trim();
  const newColor = row.querySelector('.cm-color').value;
  if(!newName) return;
  const cat = state.categories.find(c=>c.name===oldName);
  if(!cat) return;
  cat.color = newColor;
  if(newName !== oldName){
    if(state.categories.some(c=>c.name.toLowerCase()===newName.toLowerCase() && c!==cat)){ alert(newName); return; }
    cat.name = newName;
    state.suppliers.forEach(s => {
      s.categories = (s.categories||[]).map(cn => cn===oldName ? newName : cn);
    });
    await saveSuppliers();
  }
  await saveCategories();
  renderStats(); renderFilters(); renderGrid();
  renderCategoryManager(window.__catManagerReturnSupplier);
}

async function deleteCategoryByName(name){
  const inUse = state.suppliers.filter(s => (s.categories||[]).includes(name)).length;
  const msg = inUse > 0 ? `${t('confirmDeleteCategory')} (${inUse} ${t('suppliers')})` : t('confirmDeleteCategory');
  if(!confirm(msg)) return;
  state.categories = state.categories.filter(c=>c.name!==name);
  state.suppliers.forEach(s => { s.categories = (s.categories||[]).filter(cn=>cn!==name); });
  await saveCategories();
  await saveSuppliers();
  renderStats(); renderFilters(); renderGrid();
  renderCategoryManager(window.__catManagerReturnSupplier);
}

async function adminCreateUser(){
  const username = document.getElementById('newUserName').value.trim();
  const password = document.getElementById('newUserPass').value;
  const role = document.getElementById('newUserRole').value;
  if(!username || !password || password.length < 6){ alert('Username + password (6+ chars) required.'); return; }
  try{
    await callEdgeFunction('admin-users', { action:'create_user', username, password, role });
    renderAdminPanel('users');
  }catch(e){ alert(e.message); }
}
async function adminToggleUser(id, currentStatus){
  const action = currentStatus === 'active' ? 'deactivate_user' : 'reactivate_user';
  try{ await callEdgeFunction('admin-users', { action, user_id:id }); renderAdminPanel('users'); }
  catch(e){ alert(e.message); }
}
async function adminResetPassword(id, username){
  const pw = prompt(`New password for ${username} (min 6 chars):`);
  if(!pw) return;
  try{ await callEdgeFunction('admin-users', { action:'reset_password', user_id:id, new_password: pw }); alert('Password reset.'); }
  catch(e){ alert(e.message); }
}
async function adminDeleteUser(id, username){
  if(!confirm(`Permanently delete ${username} and all their data? This cannot be undone.`)) return;
  try{ await callEdgeFunction('admin-users', { action:'delete_user', user_id:id }); renderAdminPanel('users'); }
  catch(e){ alert(e.message); }
}

/* ================= AI features ================= */
async function callClaude(systemPrompt, userPrompt){
  const data = await callEdgeFunction('ai-proxy', { system: systemPrompt, prompt: userPrompt });
  return data.text || '';
}

async function runAiAutoFill(s){
  const raw = document.getElementById('aiPaste').value.trim();
  if(!raw) return;
  const loading = document.getElementById('aiFillLoading');
  loading.classList.remove('hidden');
  try{
    const categories = state.categories.map(c=>c.name).join(', ');
    const sys = "You extract supplier/vendor information from raw pasted text and output ONLY a JSON object, no markdown fences, no preamble. Fields: name, categories (array of strings, pick closest matches from this list where possible: "+categories+", else invent short ones), tags (array of strings), description, city, availability, priceRange, languages, social, website, contactName, contactPhone, contactWhatsapp, contactEmail, howMet, notes. Use empty string or empty array for anything not mentioned. Respond with raw JSON only.";
    const text = await callClaude(sys, raw);
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(parsed.name) document.getElementById('f_name').value = parsed.name;
    if(parsed.categories && parsed.categories.length){
      parsed.categories.forEach(cn => {
        if(!state.categories.some(c=>c.name.toLowerCase()===String(cn).toLowerCase())){
          state.categories.push({name:cn, color:'#B1A7FD', group:'Custom'});
        }
      });
      await saveCategories();
      document.getElementById('catChecklist').innerHTML = categoryChecklistHtml(parsed.categories);
    }
    if(parsed.tags) document.getElementById('f_tags').value = (parsed.tags||[]).join(', ');
    if(parsed.description) document.getElementById('f_description').value = parsed.description;
    if(parsed.city) document.getElementById('f_city').value = parsed.city;
    if(parsed.availability) document.getElementById('f_availability').value = parsed.availability;
    if(parsed.priceRange) document.getElementById('f_priceRange').value = parsed.priceRange;
    if(parsed.languages) document.getElementById('f_languages').value = parsed.languages;
    if(parsed.social) document.getElementById('f_social').value = parsed.social;
    if(parsed.website) document.getElementById('f_website').value = parsed.website;
    if(parsed.howMet) document.getElementById('f_howMet').value = parsed.howMet;
    const firstBlock = document.querySelector('#contactsWrap .contact-block');
    if(firstBlock){
      if(parsed.contactName) firstBlock.querySelector('.c-name').value = parsed.contactName;
      if(parsed.contactPhone) firstBlock.querySelector('.c-phone').value = parsed.contactPhone;
      if(parsed.contactWhatsapp) firstBlock.querySelector('.c-whatsapp').value = parsed.contactWhatsapp;
      if(parsed.contactEmail) firstBlock.querySelector('.c-email').value = parsed.contactEmail;
    }
  }catch(e){
    alert('AI auto-fill failed: ' + e.message);
  }
  loading.classList.add('hidden');
}

async function runAiFind(){
  const query = document.getElementById('aiQuery').value.trim();
  if(!query) return;
  const loading = document.getElementById('aiLoading');
  const resultBox = document.getElementById('aiResult');
  loading.classList.remove('hidden');
  resultBox.classList.add('hidden');
  try{
    const compact = state.suppliers.map(s => ({
      name:s.name, categories:s.categories, tags:s.tags, city:s.city, priceRange:s.priceRange,
      availability:s.availability, rating:s.rating, tier:s.tier, status:s.status,
      turnaround:s.turnaround, minQty:s.minQty, description:s.description
    }));
    const sys = "You are a supplier-matching assistant for an Algerian creative agency called Colab. Given a JSON list of suppliers and a need, recommend the best 1-3 matches with a short reason each, in the same language as the user's request. If nothing matches well, say so plainly. Be concise, plain text, no markdown headers.";
    const userMsg = "Suppliers: " + JSON.stringify(compact) + "\\n\\nNeed: " + query;
    const text = await callClaude(sys, userMsg);
    resultBox.textContent = text;
    resultBox.classList.remove('hidden');
  }catch(e){
    resultBox.textContent = 'Error: ' + e.message;
    resultBox.classList.remove('hidden');
  }
  loading.classList.add('hidden');
}

/* ================= CSV export/import ================= */
function exportCsv(){
  const rows = state.suppliers.map(s => ({
    owner: s._ownerUsername || state.profile.username,
    name:s.name, categories:(s.categories||[]).join('|'), tags:(s.tags||[]).join('|'), description:s.description,
    tier:s.tier, status:s.status, availability:s.availability, rating:s.rating, review:s.review, wouldWorkAgain:s.wouldWorkAgain,
    blacklistReason:s.blacklistReason,
    contacts: JSON.stringify(s.contacts||[]),
    paymentTerms:s.paymentTerms, paymentMethod:s.paymentMethod, bankInfo:s.bankInfo, invoiceHistory:s.invoiceHistory,
    city:s.city, delivery:s.delivery, turnaround:s.turnaround, minQty:s.minQty, languages:s.languages,
    priceRange:s.priceRange, lastQuoted:s.lastQuoted,
    social:s.social, website:s.website, portfolio:s.portfolio, photos:(s.photos||[]).join('|'),
    priceList:s.priceList, catalog:s.catalog, contract:s.contract,
    howMet:s.howMet, projects:s.projects, lastContacted:s.lastContacted,
    log: JSON.stringify(s.log||[])
  }));
  const csv = Papa.unparse(rows);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'colab_suppliers.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importCsvFile(file){
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: async (results) => {
      const imported = results.data.map(row => {
        let contacts = [];
        let log = [];
        try{ contacts = JSON.parse(row.contacts||'[]'); }catch(e){ contacts=[emptyContact()]; }
        try{ log = JSON.parse(row.log||'[]'); }catch(e){ log=[]; }
        const cats = (row.categories||row.category||'').split('|').map(x=>x.trim()).filter(Boolean);
        cats.forEach(cn => { if(!state.categories.some(c=>c.name.toLowerCase()===cn.toLowerCase())) state.categories.push({name:cn, color:'#B1A7FD', group:'Custom'}); });
        return {
          id: uid(), name:row.name||'', categories:cats, tags:(row.tags||'').split('|').filter(Boolean),
          description:row.description||'', tier:row.tier||'New', status:row.status||'Active', availability:row.availability||'',
          rating: parseInt(row.rating)||0, review:row.review||'', wouldWorkAgain:row.wouldWorkAgain||'',
          blacklistReason:row.blacklistReason||'', contacts: contacts.length?contacts:[emptyContact()],
          paymentTerms:row.paymentTerms||'', paymentMethod:row.paymentMethod||'', bankInfo:row.bankInfo||'', invoiceHistory:row.invoiceHistory||'',
          city:row.city||'', delivery:row.delivery||'', turnaround:row.turnaround||'', minQty:row.minQty||'', languages:row.languages||'',
          priceRange:row.priceRange||'', lastQuoted:row.lastQuoted||'',
          social:row.social||'', website:row.website||'', portfolio:row.portfolio||'', photos:(row.photos||'').split('|').filter(Boolean),
          priceList:row.priceList||'', catalog:row.catalog||'', contract:row.contract||'',
          howMet:row.howMet||'', projects:row.projects||'', lastContacted:row.lastContacted||'',
          log, createdAt: new Date().toISOString()
        };
      });
      state.suppliers = state.suppliers.concat(imported);
      await saveSuppliers();
      await saveCategories();
      renderStats(); renderFilters(); renderGrid();
      alert('Imported ' + imported.length + ' suppliers.');
    }
  });
}
